<!doctype html><meta charset="utf-8"><script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
<!-- page for scripts/fbx-to-glb.mjs: FBX -> glb in the browser (three from node_modules, dev only) -->
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from '/node_modules/three/examples/jsm/loaders/FBXLoader.js';
import { GLTFExporter } from '/node_modules/three/examples/jsm/exporters/GLTFExporter.js';
window.convert = async (url) => {
  const obj = await new FBXLoader().loadAsync(url);
  const info = { clips: obj.animations.map((a) => [a.name, +a.duration.toFixed(2)]), meshes: 0, mats: [] };
  obj.traverse((o) => { if (o.isMesh) { info.meshes++; for (const m of [].concat(o.material)) info.mats.push(`${m.name}:${m.color?.getHexString()}${m.map ? '+map' : ''}`); } });
  const box = new THREE.Box3().setFromObject(obj); info.size = box.getSize(new THREE.Vector3()).toArray().map((x) => +x.toFixed(1));
  const glb = await new GLTFExporter().parseAsync(obj, { binary: true, animations: obj.animations });
  const bytes = new Uint8Array(glb); let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return { info, b64: btoa(s) };
};
window.ready = true;
</script>
